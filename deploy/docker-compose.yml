services:
  # PostgreSQL 数据库
  database:
    image: postgres:16-alpine
    container_name: beepbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beepbot}
      POSTGRES_USER: ${POSTGRES_USER:-beepbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beepbot123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beepbot} -d ${POSTGRES_DB:-beepbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beepbot-network

  # 后端 API 服务
  backend:
    build:
      context: ../beepbot
      dockerfile: Dockerfile
    container_name: beepbot-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8888}:8888"
    volumes:
      # 配置文件
      - ./config.json:/app/config.json:ro
      # 数据持久化 - 技能、工作空间等
      - beepbot_data:/data/beepbot
      # 加密密钥持久化
      - beepbot_keys:/app/.keys
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - beepbot-network

  # 前端 Dashboard
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: beepbot-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - beepbot-network

volumes:
  # 数据库数据持久化
  postgres_data:
    name: beepbot_postgres_data
  # 应用数据持久化（技能、工作空间等）
  beepbot_data:
    name: beepbot_data
  # 密钥持久化（加密密钥、JWT 密钥）
  beepbot_keys:
    name: beepbot_keys

networks:
  beepbot-network:
    name: beepbot-network
    driver: bridge